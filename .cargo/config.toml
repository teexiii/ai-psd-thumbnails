# Link the MSVC C runtime statically so thumb_viewer.dll and installer-ca.exe
# load on a clean Windows install without the VC++ Redistributable.
# Without this, installer-ca.exe fails with STATUS_DLL_NOT_FOUND (VCRUNTIME140.dll)
# and the MSI aborts with 1603; Explorer also cannot load the shell DLL.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
